version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/bambuddy1.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: bambuddy
    source: ghcr.io/maziggy/bambuddy
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    create_if_missing: true
    application:
      language: zh
      brief: "3D 打印机管理台"
      description: "Bambuddy 为拓竹（Bambu Lab）3D 打印机提供统一管理面板：打印机状态、耗材、打印队列、模型归档与统计分析。"
      keywords: "3D打印, 拓竹, Bambu, 打印队列, 耗材"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
